services:
  mongodb:
    image: mongo:latest
    container_name: devshare-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: devshare
      MONGO_INITDB_ROOT_PASSWORD: devshare_password_2025
      MONGO_INITDB_DATABASE: devshare
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - devshare-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local

networks:
  devshare-network:
    driver: bridge
